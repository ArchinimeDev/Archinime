<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opciones de Cuenta - Archinime</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../js/core/state.js?v=2025-04-10-v24.0-modular"></script>

  <style>
    :root {
      --primary-color: #00fff7;
      --accent-color: #bc13fe;
      --dark-bg: #050505;
      --glass-bg: rgba(10, 12, 16, 0.85);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--dark-bg);
      background-image: url('../assets/img/galaxia-morado1.avif');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Poppins', sans-serif;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .options-container {
      background: var(--glass-bg);
      border: 1px solid var(--accent-color);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.9), 0 0 20px rgba(188, 19, 254, 0.2);
      backdrop-filter: blur(15px);
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #aaa;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 25px;
      transition: 0.2s;
    }
    .back-btn:hover { color: var(--primary-color); transform: translateX(-5px); }
    h2 { font-family: 'Orbitron', sans-serif; text-align: center; color: var(--primary-color); margin-bottom: 30px; letter-spacing: 1px;}
    
    .form-group { margin-bottom: 22px; }
    .form-group label { display: block; font-size: 0.9rem; color: #ccc; margin-bottom: 8px; font-weight: 600; }
    .form-group input[type="text"] {
      width: 100%; padding: 14px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.5); color: white; font-family: 'Poppins'; outline: none; transition: 0.3s;
    }
    .form-group input[type="text"]:focus { border-color: var(--primary-color); box-shadow: 0 0 10px rgba(0,255,247,0.2); }
    
    .avatar-preview {
      display: flex; flex-direction: column;
      align-items: center; gap: 15px; margin-bottom: 20px;
    }
    .avatar-preview img {
      width: 100px;
      height: 100px; border-radius: 50%; object-fit: cover;
      border: 2px solid var(--primary-color); box-shadow: 0 0 15px rgba(0,255,247,0.3);
      transition: 0.3s;
    }
    .upload-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); padding: 8px 20px;
      border-radius: 20px; color: white; cursor: pointer; transition: 0.2s; font-size: 0.85rem;
    }
    .upload-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--primary-color); }

    /* ============================================ */
    /* ========== SELECTOR DE COLOR NUEVO ========= */
    /* ============================================ */
    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 16px 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(0,255,247,0.04), rgba(188,19,254,0.06));
      border: 1px solid rgba(188, 19, 254, 0.25);
      transition: 0.3s;
    }
    .color-picker-wrapper:hover {
      border-color: rgba(0, 255, 247, 0.45);
      box-shadow: 0 0 22px rgba(0, 255, 247, 0.08);
    }

    /* Círculo perfecto — usamos aspect-ratio + border-radius 50% */
    .color-circle {
      position: relative;
      width: 62px;
      height: 62px;
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--current-color, #00fff7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.3s, transform 0.2s;
      box-shadow:
        0 0 0 3px rgba(255,255,255,0.08),
        0 0 18px var(--current-color, #00fff7),
        0 0 32px var(--current-color, #00fff7);
      overflow: hidden;
    }
    .color-circle::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), transparent 55%);
      pointer-events: none;
    }
    .color-circle:hover {
      transform: scale(1.05);
    }
    .color-circle:active {
      transform: scale(0.97);
    }
    /* El input color nativo está oculto detrás, cubriendo el círculo completo */
    .color-circle input[type="color"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: none;
      padding: 0;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
    }
    .color-circle i {
      position: relative;
      z-index: 2;
      color: #fff;
      font-size: 1.15rem;
      text-shadow: 0 0 8px rgba(0,0,0,0.85), 0 0 3px rgba(0,0,0,0.9);
      pointer-events: none;
    }

    .color-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .color-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      font-weight: 700;
      color: var(--primary-color);
      text-shadow: 0 0 8px rgba(0, 255, 247, 0.55);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .color-subtitle {
      font-size: 0.75rem;
      color: #a8a8b8;
      line-height: 1.35;
    }

    /* Fila de presets + chip HEX */
    .color-bottom-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    /* Chips de colores preestablecidos */
    .color-presets {
      display: flex;
      gap: 6px;
    }
    .preset-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.15);
      padding: 0;
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 6px currentColor;
    }
    .preset-dot:hover {
      transform: scale(1.2);
      border-color: #fff;
    }
    .preset-dot.active {
      border-color: #fff;
      transform: scale(1.15);
      box-shadow: 0 0 12px currentColor, 0 0 0 2px rgba(255,255,255,0.3);
    }

    /* Chip HEX */
    .color-hex {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 3px 9px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      letter-spacing: 1px;
      transition: 0.3s;
      margin-left: auto;
    }
    .color-hex .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary-color);
      box-shadow: 0 0 8px var(--primary-color);
      transition: 0.3s;
    }

    .save-btn {
      width: 100%; background: var(--primary-color); color: #000; border: none;
      padding: 16px; border-radius: 10px;
      font-weight: 900; font-family: 'Orbitron'; letter-spacing: 1px; cursor: pointer; transition: 0.3s; margin-top: 10px;
    }
    .save-btn:hover { background: #fff; box-shadow: 0 0 20px rgba(0,243,255,0.5); transform: translateY(-2px); }
    .save-btn:disabled { background: #555; cursor: not-allowed; box-shadow: none; transform: none; }
    
    #statusMsg {
      text-align: center;
      margin-top: 15px;
      font-weight: 700;
      font-size: 0.95rem;
      min-height: 24px;
      padding: 10px 12px;
      border-radius: 8px;
      transition: 0.3s;
      word-break: break-word;
    }
    #statusMsg:not(:empty) {
      background: rgba(0,0,0,0.6);
      border: 1px solid currentColor;
      box-shadow: 0 0 15px currentColor;
    }

    @media (max-width: 420px) {
      .options-container { padding: 26px 20px; }
      .color-circle { width: 54px; height: 54px; }
      .color-picker-wrapper { gap: 14px; padding: 14px; }
      .color-title { font-size: 0.68rem; }
      .color-subtitle { font-size: 0.7rem; }
      .preset-dot { width: 16px; height: 16px; }
    }
  </style>
</head>
<body>

  <div class="options-container">
    <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Volver a inicio</a>
    <h2>CONFIGURACIÓN</h2>

    <div class="avatar-preview">
      <img id="avatarImg" src="../assets/img/invitado.avif" alt="Avatar">
      <label class="upload-btn" for="avatarInput">
        <i class="fas fa-upload"></i> Subir nuevo avatar
      </label>
      <input type="file" id="avatarInput" accept="image/*" style="display: none;">
    </div>

    <div class="form-group">
      <label>ID Único de Cuenta</label>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="userUid" readonly style="color: #aaa; background: rgba(0,0,0,0.6); cursor: not-allowed; border-color: rgba(255,255,255,0.1);">
        <button class="upload-btn" onclick="copiarUID()" style="margin: 0; padding: 0 15px; font-size: 1rem; border-radius: 10px;" title="Copiar ID"><i class="fas fa-copy"></i></button>
      </div>
      <span style="font-size: 0.8rem; color: #888; margin-top: 5px; display: inline-block;">Este ID es único y no puede cambiarse.</span>
    </div>

    <div class="form-group">
      <label>Nombre Público</label>
      <input type="text" id="displayName" placeholder="Ej: CyberNinja99">
    </div>

    <div class="form-group">
      <label>Color de Nombre</label>
      <div class="color-picker-wrapper">
        <label class="color-circle" id="colorCircle" for="nameColor" title="Clic para elegir color">
          <input type="color" id="nameColor" value="#00fff7">
          <i class="fas fa-palette"></i>
        </label>
        <div class="color-info">
          <span class="color-title"><i class="fas fa-bolt"></i> Tu Neón</span>
          <span class="color-subtitle">Afecta tu nombre en comentarios y tu avatar</span>
          <div class="color-bottom-row">
            <div class="color-presets" id="colorPresets"></div>
            <span class="color-hex">
              <span class="dot" id="colorDot"></span>
              <span id="colorHexText">#00FFF7</span>
            </span>
          </div>
        </div>
      </div>
    </div>

    <button id="saveBtn" class="save-btn" onclick="guardarCambios()">GUARDAR CAMBIOS</button>
    <div id="statusMsg"></div>
  </div>

  <script>
    // ========== CONFIG FIREBASE ==========
    const firebaseConfig = {
      apiKey: "AIzaSyBpzYARIxaJijLbbL-2S6F9MWecbAbvK_I",
      authDomain: "login-admin-archinime.firebaseapp.com",
      projectId: "login-admin-archinime",
      storageBucket: "login-admin-archinime.firebasestorage.app",
      messagingSenderId: "938164660242",
      appId: "1:938164660242:web:648e0dce0e0d18dd78d0cb"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/dbcqcai1q/upload';
    const CLOUDINARY_PRESET = 'stickers_archinime';
    let currentUser = null;
    let newAvatarUrl = null;
    let lastProfileUpdate = 0;
    let userReady = false;

    // Paleta de presets neón
    const PRESET_COLORS = ['#00fff7', '#bc13fe', '#ff0055', '#00ff33', '#ffaa00', '#00aaff'];

    function getNeonColorByString(str) {
      const neonColors = ['#00fff7', '#ff0055', '#bc13fe', '#00ff33', '#ffff00', '#ffaa00', '#ff00aa', '#00aaff'];
      let hash = 0;
      for (let i = 0; i < (str || '').length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      return neonColors[Math.abs(hash) % neonColors.length];
    }

    // ========== Helper para mensajes de estado ==========
    function setStatus(msg, color) {
      const statusMsg = document.getElementById('statusMsg');
      statusMsg.style.color = color || '#fff';
      statusMsg.innerText = msg;
      console.log('[opciones] status:', msg);
    }

    // ========== Crear los preset dots ==========
    function renderPresets(activeColor) {
      const container = document.getElementById('colorPresets');
      if (!container) return;
      container.innerHTML = '';
      PRESET_COLORS.forEach(color => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'preset-dot' + (color.toLowerCase() === (activeColor || '').toLowerCase() ? ' active' : '');
        btn.style.background = color;
        btn.style.color = color; // para el box-shadow: currentColor
        btn.dataset.color = color;
        btn.title = color.toUpperCase();
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          document.getElementById('nameColor').value = color;
          updateColorPreview(color);
        });
        container.appendChild(btn);
      });
    }

    // ========== Actualizar vista previa del color ==========
    function updateColorPreview(color) {
      // Círculo principal
      const circle = document.getElementById('colorCircle');
      if (circle) {
        circle.style.setProperty('--current-color', color);
      }
      // Dot del chip
      const dot = document.getElementById('colorDot');
      if (dot) {
        dot.style.background = color;
        dot.style.boxShadow = `0 0 10px ${color}, 0 0 18px ${color}80`;
      }
      // Texto HEX
      const hexText = document.getElementById('colorHexText');
      if (hexText) {
        hexText.textContent = (color || '#00FFF7').toUpperCase();
      }
      // Avatar preview
      const avatarImg = document.getElementById('avatarImg');
      if (avatarImg) {
        avatarImg.style.borderColor = color;
        avatarImg.style.boxShadow = `0 0 20px ${color}80, 0 0 35px ${color}40`;
      }
      // Marcar preset activo
      document.querySelectorAll('.preset-dot').forEach(el => {
        if (el.dataset.color.toLowerCase() === (color || '').toLowerCase()) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });
    }

    // Listener del color picker nativo
    document.getElementById('nameColor').addEventListener('input', (e) => {
      updateColorPreview(e.target.value);
    });
    document.getElementById('nameColor').addEventListener('change', (e) => {
      updateColorPreview(e.target.value);
    });

    // Inicializar presets con el color por defecto
    renderPresets('#00fff7');

    // ========== Sincronización con estado global ==========
    function syncWithGlobalState(user) {
      if (window.ArchinimeState) {
        ArchinimeState.set('currentUser', user);
        if (user) {
          db.collection('users').doc(user.uid).get().then(doc => {
            if (doc.exists && doc.data().customColor) {
              ArchinimeState.set('currentUserColor', doc.data().customColor);
            }
          }).catch(e => console.warn(e));
        } else {
          ArchinimeState.set('currentUserColor', null);
        }
      }
    }

    // ========== FUENTE DE VERDAD: auth.onAuthStateChanged ==========
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        window.currentUser = user;
        userReady = true;
        console.log('✅ Usuario autenticado en opciones.html:', user.uid);
        await cargarDatosUsuario(user);
        syncWithGlobalState(user);
      } else {
        console.warn('⚠️ Sin usuario autenticado, redirigiendo a index...');
        window.location.href = '../index.html';
      }
    });

    async function cargarDatosUsuario(user) {
      try {
        document.getElementById('userUid').value = user.uid;
        document.getElementById('displayName').value = user.displayName || (user.email ? user.email.split('@')[0] : 'Usuario');
        document.getElementById('avatarImg').src = user.photoURL || '../assets/img/invitado.avif';
        newAvatarUrl = user.photoURL || null;

        const doc = await db.collection('users').doc(user.uid).get();
        let color;
        if (doc.exists) {
          const data = doc.data();
          if (data.customColor) {
            color = data.customColor;
          } else {
            color = getNeonColorByString(user.uid || user.displayName || user.email || 'user');
          }
          if (data.lastProfileUpdate) {
            lastProfileUpdate = data.lastProfileUpdate.toMillis
              ? data.lastProfileUpdate.toMillis()
              : (data.lastProfileUpdate.seconds ? data.lastProfileUpdate.seconds * 1000 : 0);
          }
          console.log('📅 lastProfileUpdate cargado:', new Date(lastProfileUpdate));
        } else {
          color = getNeonColorByString(user.uid || user.displayName || user.email || 'user');
        }

        document.getElementById('nameColor').value = color;
        updateColorPreview(color);
      } catch(e) { 
        console.error("Error obteniendo datos: ", e); 
      }
    }

    function copiarUID() {
      const uidInput = document.getElementById('userUid');
      if (uidInput.value) {
        navigator.clipboard.writeText(uidInput.value);
        setStatus('¡ID copiado al portapapeles!', '#00fff7');
        setTimeout(() => {
          const s = document.getElementById('statusMsg');
          if (s.innerText.includes('copiado')) s.innerText = '';
        }, 3000);
      }
    }

    document.getElementById('avatarInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 2 * 1024 * 1024) {
        alert('La imagen es muy pesada. El tamaño máximo permitido es 2 MB.');
        e.target.value = '';
        return;
      }
      
      const btnLabel = document.querySelector('.upload-btn');
      btnLabel.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Subiendo...';
      
      try {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_PRESET);
        
        const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
        const data = await res.json();
        
        if (data.secure_url) {
          newAvatarUrl = data.secure_url;
          document.getElementById('avatarImg').src = newAvatarUrl;
          setStatus('Avatar subido. Pulsa GUARDAR para aplicar.', '#00fff7');
        }
      } catch (err) {
        alert("Error subiendo la imagen.");
      } finally {
        btnLabel.innerHTML = '<i class="fas fa-upload"></i> Subir nuevo avatar';
      }
    });

    async function guardarCambios() {
      const saveBtn = document.getElementById('saveBtn');

      console.log('🟡 guardarCambios invocado. userReady=', userReady, 'currentUser=', currentUser);

      if (!userReady || !currentUser) {
        setStatus('⚠️ Esperando datos del usuario... intenta de nuevo en un momento.', '#ff0055');
        console.warn('guardarCambios: currentUser es null. userReady =', userReady);
        return;
      }

      const newName = document.getElementById('displayName').value.trim();
      const newColor = document.getElementById('nameColor').value;

      if (!newName) {
        setStatus('El nombre no puede estar vacío.', '#ff0055');
        return;
      }

      const isAdmin = currentUser.email === 'archinime12@gmail.com';
      const now = Date.now();
      const fiveDaysMs = 5 * 24 * 60 * 60 * 1000;
      if (!isAdmin && lastProfileUpdate > 0 && (now - lastProfileUpdate < fiveDaysMs)) {
        const msLeft = fiveDaysMs - (now - lastProfileUpdate);
        const daysLeft = Math.ceil(msLeft / (1000 * 60 * 60 * 24));
        setStatus(`⏳ Has cambiado tu perfil recientemente. Vuelve a intentarlo en ${daysLeft} días.`, '#ff0055');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = 'GUARDANDO...';
      setStatus('Guardando cambios...', '#fff');

      try {
        const profileUpdates = { displayName: newName };
        if (newAvatarUrl && typeof newAvatarUrl === 'string' && newAvatarUrl.startsWith('http')) {
          profileUpdates.photoURL = newAvatarUrl;
        }
        console.log('📝 profileUpdates:', profileUpdates);
        await currentUser.updateProfile(profileUpdates);
        console.log('✅ updateProfile OK');

        await db.collection('users').doc(currentUser.uid).set({
          customColor: newColor,
          lastProfileUpdate: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
        console.log('✅ Firestore set OK');

        setStatus('Actualizando comentarios históricos...', '#fff');

        try {
          const commentsRef = db.collection('comments').where('userId', '==', currentUser.uid);
          const snapshot = await commentsRef.get();
          const batch = db.batch();
          let ops = 0;

          snapshot.forEach(doc => {
            batch.update(doc.ref, {
              userName: newName,
              userAvatar: newAvatarUrl || currentUser.photoURL || '../assets/img/invitado.avif',
              customColor: newColor
            });
            ops++;
          });
          if (ops > 0) {
            await batch.commit();
            console.log('✅ Comentarios actualizados:', ops);
          }
        } catch (commentsErr) {
          console.warn('⚠️ No se pudieron actualizar comentarios históricos:', commentsErr);
        }

        syncWithGlobalState(currentUser);

        lastProfileUpdate = Date.now();
        setStatus('✅ ¡Cambios guardados exitosamente!', '#00fff7');

        currentUser.displayName = newName;
        if (profileUpdates.photoURL) currentUser.photoURL = profileUpdates.photoURL;

      } catch (err) {
        console.error('❌ Error al guardar:', err);
        setStatus('Error al guardar: ' + (err.message || 'desconocido'), '#ff0055');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = 'GUARDAR CAMBIOS';
      }
    }

    window.copiarUID = copiarUID;
    window.guardarCambios = guardarCambios;
  </script>
</body>
</html>
